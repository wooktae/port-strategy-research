name: Research CodeBuild

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the verified Git SHA image to ECR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: research-codebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codebuild:
    name: Research Build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      CODEBUILD_PROJECT_NAME: ${{ vars.CODEBUILD_PROJECT_NAME }}

      ECR_REPOSITORY_NAME: portfolio-strategy-research
      CANDIDATE_JOB_DEFINITION_NAME: portfolio-paper-strategy-research-candidate
      CANDIDATE_JOB_QUEUE: portfolio-paper-strategy-research-queue

    steps:
      - name: Validate workflow configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${AWS_REGION}" ]]; then
            echo "AWS_REGION repository variable is required"
            exit 10
          fi

          if [[ -z "${AWS_OIDC_ROLE_ARN}" ]]; then
            echo "AWS_OIDC_ROLE_ARN repository variable is required"
            exit 11
          fi

          if [[ -z "${CODEBUILD_PROJECT_NAME}" ]]; then
            echo "CODEBUILD_PROJECT_NAME repository variable is required"
            exit 12
          fi

          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA_INVALID=${GITHUB_SHA}"
            exit 13
          fi

          echo "SOURCE_SHA=${GITHUB_SHA}"
          echo "WORKFLOW_CONFIGURATION=SUCCESS"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release gate
        id: release
        shell: bash
        env:
          DISPATCH_PUSH_IMAGE: ${{ inputs.push_image }}
        run: |
          set -euo pipefail

          PUSH_IMAGE="false"
          AUTO_CANDIDATE="false"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            PUSH_IMAGE="true"
            AUTO_CANDIDATE="true"

          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${DISPATCH_PUSH_IMAGE}" == "true" ]]; then
              PUSH_IMAGE="true"
            fi
          fi

          echo "push_image=${PUSH_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "auto_candidate=${AUTO_CANDIDATE}" >> "${GITHUB_OUTPUT}"

          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "PUSH_IMAGE=${PUSH_IMAGE}"
          echo "AUTO_CANDIDATE=${AUTO_CANDIDATE}"

          if [[ "${PUSH_IMAGE}" == "true" ]]; then
            echo "ARTIFACT_PUBLISH=ENABLED"
          else
            echo "ARTIFACT_PUBLISH=DISABLED"
          fi

          if [[ "${AUTO_CANDIDATE}" == "true" ]]; then
            echo "CANDIDATE_AUTOMATION=ENABLED"
          else
            echo "CANDIDATE_AUTOMATION=DISABLED"
          fi

          echo "RELEASE_STAGE=BUILD_ONLY"
          echo "OPERATING_PROMOTION=DISABLED"
          echo "STEP_FUNCTIONS_UPDATE=DISABLED"
          echo "RELEASE_GATE_RESOLUTION=SUCCESS"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: research-codebuild-${{ github.run_id }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          AWS_ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "AWS_ACCOUNT_ID_INVALID=${AWS_ACCOUNT_ID}"
            exit 30
          fi

          echo "AWS_ACCOUNT_ID_RESOLVED=YES"
          echo "AWS_OIDC_AUTHENTICATION=SUCCESS"

      - name: Start Research CodeBuild
        id: start
        shell: bash
        env:
          PUSH_IMAGE: ${{ steps.release.outputs.push_image }}
        run: |
          set -euo pipefail

          BUILD_ID="$(
            aws codebuild start-build \
              --region "${AWS_REGION}" \
              --project-name "${CODEBUILD_PROJECT_NAME}" \
              --source-version "${GITHUB_SHA}" \
              --environment-variables-override \
                name=PUSH_IMAGE,value="${PUSH_IMAGE}",type=PLAINTEXT \
                name=RELEASE_STAGE,value=BUILD_ONLY,type=PLAINTEXT \
              --query 'build.id' \
              --output text
          )"

          if [[ -z "${BUILD_ID}" || "${BUILD_ID}" == "None" ]]; then
            echo "CODEBUILD_BUILD_ID_EMPTY"
            exit 40
          fi

          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"

          echo "SOURCE_SHA=${GITHUB_SHA}"
          echo "PUSH_IMAGE=${PUSH_IMAGE}"
          echo "CODEBUILD_START=SUCCESS"

      - name: Wait for Research CodeBuild
        shell: bash
        env:
          BUILD_ID: ${{ steps.start.outputs.build_id }}
        run: |
          set -euo pipefail

          TERMINAL_STATUSES=(
            SUCCEEDED
            FAILED
            FAULT
            STOPPED
            TIMED_OUT
          )

          while true; do
            BUILD_STATUS="$(
              aws codebuild batch-get-builds \
                --region "${AWS_REGION}" \
                --ids "${BUILD_ID}" \
                --query 'builds[0].buildStatus' \
                --output text
            )"

            if [[ -z "${BUILD_STATUS}" || "${BUILD_STATUS}" == "None" ]]; then
              echo "CODEBUILD_STATUS_EMPTY"
              exit 50
            fi

            echo "CODEBUILD_STATUS=${BUILD_STATUS}"

            IS_TERMINAL="false"

            for status in "${TERMINAL_STATUSES[@]}"; do
              if [[ "${BUILD_STATUS}" == "${status}" ]]; then
                IS_TERMINAL="true"
                break
              fi
            done

            if [[ "${IS_TERMINAL}" == "true" ]]; then
              break
            fi

            sleep 10
          done

          if [[ "${BUILD_STATUS}" != "SUCCEEDED" ]]; then
            echo "RESEARCH_CODEBUILD_RESULT=${BUILD_STATUS}"
            exit 51
          fi

          echo "RESEARCH_CODEBUILD_RESULT=SUCCEEDED"
          echo "RESEARCH_BUILD_VERIFIED=SUCCESS"

      - name: Run Research Candidate
        id: candidate
        if: steps.release.outputs.auto_candidate == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail

          bash .devops/scripts/deploy-candidate.sh \
            "${SOURCE_SHA}" \
            "${AWS_REGION}" \
            "${ECR_REPOSITORY_NAME}" \
            "${CANDIDATE_JOB_DEFINITION_NAME}" \
            "${CANDIDATE_JOB_QUEUE}" \
            "${GITHUB_RUN_ID_VALUE}"

      - name: Verify operating boundary unchanged
        if: steps.release.outputs.auto_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "OPERATING_JOB_DEFINITION_MUTATION=NO"
          echo "STEP_FUNCTIONS_UPDATE_EXECUTED=NO"
          echo "CHAMPION_PROMOTION_EXECUTED=NO"
          echo "RESEARCH_CANDIDATE_ONLY_RELEASE=SUCCESS"

      - name: Publish workflow summary
        if: always()
        shell: bash
        env:
          PUSH_IMAGE: ${{ steps.release.outputs.push_image }}
          AUTO_CANDIDATE: ${{ steps.release.outputs.auto_candidate }}
          BUILD_ID: ${{ steps.start.outputs.build_id }}
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.candidate_revision }}
          CANDIDATE_JOB_NAME: ${{ steps.candidate.outputs.candidate_job_name }}
          CANDIDATE_EXIT_CODE: ${{ steps.candidate.outputs.candidate_exit_code }}
        run: |
          {
            echo "## Research DevOps"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Source SHA | \`${GITHUB_SHA:0:12}\` |"
            echo "| Event | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Push Image | \`${PUSH_IMAGE:-false}\` |"
            echo "| Auto Candidate | \`${AUTO_CANDIDATE:-false}\` |"
            echo "| CodeBuild Started | \`${BUILD_ID:+YES}\` |"
            echo "| Candidate Revision | \`${CANDIDATE_REVISION:-N/A}\` |"
            echo "| Candidate Job | \`${CANDIDATE_JOB_NAME:-N/A}\` |"
            echo "| Candidate Exit Code | \`${CANDIDATE_EXIT_CODE:-N/A}\` |"
            echo "| Champion Promotion | \`NO\` |"
            echo "| Step Functions Update | \`NO\` |"
          } >> "${GITHUB_STEP_SUMMARY}"