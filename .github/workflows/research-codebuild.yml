name: Research CodeBuild

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      strategy_change:
        description: Is Strategy Logic Changed?
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: research-codebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codebuild:
    name: Research Build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      CODEBUILD_PROJECT_NAME: ${{ vars.CODEBUILD_PROJECT_NAME }}

      ECR_REPOSITORY_NAME: portfolio-strategy-research
      CANDIDATE_JOB_DEFINITION_NAME: portfolio-paper-strategy-research-candidate
      CANDIDATE_JOB_QUEUE: portfolio-paper-strategy-research-queue
      OPERATING_JOB_DEFINITION_NAME: portfolio-paper-strategy-research

    steps:
      - name: Validate workflow configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${AWS_REGION}" ]]; then
            echo "AWS_REGION repository variable is required"
            exit 10
          fi

          if [[ -z "${AWS_OIDC_ROLE_ARN}" ]]; then
            echo "AWS_OIDC_ROLE_ARN repository variable is required"
            exit 11
          fi

          if [[ -z "${CODEBUILD_PROJECT_NAME}" ]]; then
            echo "CODEBUILD_PROJECT_NAME repository variable is required"
            exit 12
          fi

          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA_INVALID=${GITHUB_SHA}"
            exit 13
          fi

          echo "SOURCE_SHA=${GITHUB_SHA}"
          echo "WORKFLOW_CONFIGURATION=SUCCESS"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release gate
        id: release
        shell: bash
        env:
          DISPATCH_STRATEGY_CHANGE: ${{ inputs.strategy_change }}
        run: |
          set -euo pipefail

          PUSH_IMAGE="false"
          AUTO_CANDIDATE="false"
          AUTO_OPERATING="false"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "PUSH_RELEASE_ACTION=BUILD_TEST_ONLY"

          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            PUSH_IMAGE="true"

            if [[ "${DISPATCH_STRATEGY_CHANGE}" == "true" ]]; then
              AUTO_CANDIDATE="true"
            else
              AUTO_OPERATING="true"
            fi
          fi

          echo "push_image=${PUSH_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "auto_candidate=${AUTO_CANDIDATE}" >> "${GITHUB_OUTPUT}"
          echo "auto_operating=${AUTO_OPERATING}" >> "${GITHUB_OUTPUT}"

          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "PUSH_IMAGE=${PUSH_IMAGE}"
          echo "AUTO_CANDIDATE=${AUTO_CANDIDATE}"
          echo "AUTO_OPERATING=${AUTO_OPERATING}"

          if [[ "${PUSH_IMAGE}" == "true" ]]; then
            echo "ARTIFACT_PUBLISH=ENABLED"
          else
            echo "ARTIFACT_PUBLISH=DISABLED"
          fi

          if [[ "${AUTO_CANDIDATE}" == "true" ]]; then
            echo "CANDIDATE_AUTOMATION=ENABLED"
          else
            echo "CANDIDATE_AUTOMATION=DISABLED"
          fi

          echo "RELEASE_STAGE=BUILD_ONLY"
          echo "OPERATING_PROMOTION=DISABLED"
          echo "STEP_FUNCTIONS_UPDATE=DISABLED"
          echo "RELEASE_GATE_RESOLUTION=SUCCESS"

      - name: Prepare Strategy Release Identity
        id: identity
        shell: bash
        env:
          AUTO_CANDIDATE: ${{ steps.release.outputs.auto_candidate }}
        run: |
          set -euo pipefail

          RELEASE_SHA="${GITHUB_SHA}"
          STRATEGY_CONFIG_VERSION=""

          if [[ "${AUTO_CANDIDATE}" == "true" ]]; then
            mapfile -t NEW_PROFILES < <(
              git diff-tree \
                --no-commit-id \
                --name-only \
                --diff-filter=A \
                -r "${GITHUB_SHA}" \
                -- strategy_profiles/ \
              | grep -E '^strategy_profiles/RSCFG-[0-9]{4}\.json$' \
              || true
            )

            if [[ "${#NEW_PROFILES[@]}" -ne 1 ]]; then
              echo "NEW_STRATEGY_PROFILE_COUNT=${#NEW_PROFILES[@]}"
              printf 'NEW_STRATEGY_PROFILE=%s\n' "${NEW_PROFILES[@]:-}"
              echo "YES_RELEASE_REQUIRES_EXACTLY_ONE_NEW_RSCFG"
              exit 20
            fi

            PROFILE_PATH="${NEW_PROFILES[0]}"
            PROFILE_NAME="$(basename "${PROFILE_PATH}" .json)"
            STRATEGY_CONFIG_VERSION="${PROFILE_NAME}"

            if [[ ! "${STRATEGY_CONFIG_VERSION}" =~ ^RSCFG-[0-9]{4}$ ]]; then
              echo "STRATEGY_CONFIG_VERSION_INVALID=${STRATEGY_CONFIG_VERSION}"
              exit 21
            fi

            PROFILE_METADATA_VERSION="$(
              python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8-sig")); print(p.get("metadata", {}).get("strategy_config_version", ""))' "${PROFILE_PATH}"
            )"

            PROFILE_STATUS="$(
              python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8-sig")); print(p.get("metadata", {}).get("status", ""))' "${PROFILE_PATH}"
            )"

            if [[ "${PROFILE_METADATA_VERSION}" != "${STRATEGY_CONFIG_VERSION}" ]]; then
              echo "PROFILE_METADATA_VERSION_MISMATCH"
              echo "FILE_VERSION=${STRATEGY_CONFIG_VERSION}"
              echo "METADATA_VERSION=${PROFILE_METADATA_VERSION}"
              exit 22
            fi

            if [[ "${PROFILE_STATUS}" != "CANDIDATE" ]]; then
              echo "PROFILE_STATUS_INVALID=${PROFILE_STATUS}"
              exit 23
            fi

            echo "STRATEGY_PROFILE=${PROFILE_PATH}"
            echo "STRATEGY_CONFIG_VERSION=${STRATEGY_CONFIG_VERSION}"
            echo "STRATEGY_PROFILE_SELECTION=SUCCESS"
          else
            echo "STRATEGY_CONFIG_VERSION=UNCHANGED"
            echo "STRATEGY_PROFILE_SELECTION=SKIPPED"
          fi

          echo "release_sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "strategy_config_version=${STRATEGY_CONFIG_VERSION}" >> "${GITHUB_OUTPUT}"

          echo "RELEASE_SHA=${RELEASE_SHA}"
          echo "STRATEGY_RELEASE_IDENTITY=SUCCESS"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: research-codebuild-${{ github.run_id }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          AWS_ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "AWS_ACCOUNT_ID_INVALID=${AWS_ACCOUNT_ID}"
            exit 30
          fi

          echo "AWS_ACCOUNT_ID_RESOLVED=YES"
          echo "AWS_OIDC_AUTHENTICATION=SUCCESS"

      - name: Start Research CodeBuild
        id: start
        shell: bash
        env:
          PUSH_IMAGE: ${{ steps.release.outputs.push_image }}
          RELEASE_SHA: ${{ steps.identity.outputs.release_sha }}
        run: |
          set -euo pipefail

          BUILD_ID="$(
            aws codebuild start-build \
              --region "${AWS_REGION}" \
              --project-name "${CODEBUILD_PROJECT_NAME}" \
              --source-version "${RELEASE_SHA}" \
              --environment-variables-override \
                name=PUSH_IMAGE,value="${PUSH_IMAGE}",type=PLAINTEXT \
                name=RELEASE_STAGE,value=BUILD_ONLY,type=PLAINTEXT \
              --query 'build.id' \
              --output text
          )"

          if [[ -z "${BUILD_ID}" || "${BUILD_ID}" == "None" ]]; then
            echo "CODEBUILD_BUILD_ID_EMPTY"
            exit 40
          fi

          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"

          echo "SOURCE_SHA=${RELEASE_SHA}"
          echo "PUSH_IMAGE=${PUSH_IMAGE}"
          echo "CODEBUILD_START=SUCCESS"

      - name: Wait for Research CodeBuild
        shell: bash
        env:
          BUILD_ID: ${{ steps.start.outputs.build_id }}
        run: |
          set -euo pipefail

          TERMINAL_STATUSES=(
            SUCCEEDED
            FAILED
            FAULT
            STOPPED
            TIMED_OUT
          )

          while true; do
            BUILD_STATUS="$(
              aws codebuild batch-get-builds \
                --region "${AWS_REGION}" \
                --ids "${BUILD_ID}" \
                --query 'builds[0].buildStatus' \
                --output text
            )"

            if [[ -z "${BUILD_STATUS}" || "${BUILD_STATUS}" == "None" ]]; then
              echo "CODEBUILD_STATUS_EMPTY"
              exit 50
            fi

            echo "CODEBUILD_STATUS=${BUILD_STATUS}"

            IS_TERMINAL="false"

            for status in "${TERMINAL_STATUSES[@]}"; do
              if [[ "${BUILD_STATUS}" == "${status}" ]]; then
                IS_TERMINAL="true"
                break
              fi
            done

            if [[ "${IS_TERMINAL}" == "true" ]]; then
              break
            fi

            sleep 10
          done

          if [[ "${BUILD_STATUS}" != "SUCCEEDED" ]]; then
            echo "RESEARCH_CODEBUILD_RESULT=${BUILD_STATUS}"
            exit 51
          fi

          echo "RESEARCH_CODEBUILD_RESULT=SUCCEEDED"
          echo "RESEARCH_BUILD_VERIFIED=SUCCESS"

      - name: Register Research Operating Revision
        id: operating
        if: steps.release.outputs.auto_operating == 'true' && steps.release.outputs.push_image == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.release_sha }}
        run: |
          set -euo pipefail

          bash .devops/scripts/deploy-operating.sh \
            "${SOURCE_SHA}" \
            "${AWS_REGION}" \
            "${ECR_REPOSITORY_NAME}" \
            "${OPERATING_JOB_DEFINITION_NAME}"

      - name: Run Research Candidate
        id: candidate
        if: steps.release.outputs.auto_candidate == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.release_sha }}
          STRATEGY_CONFIG_VERSION: ${{ steps.identity.outputs.strategy_config_version }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail

          bash .devops/scripts/deploy-candidate.sh \
            "${SOURCE_SHA}" \
            "${AWS_REGION}" \
            "${ECR_REPOSITORY_NAME}" \
            "${CANDIDATE_JOB_DEFINITION_NAME}" \
            "${CANDIDATE_JOB_QUEUE}" \
            "${GITHUB_RUN_ID_VALUE}" \
            "${STRATEGY_CONFIG_VERSION}"

      - name: Verify operating boundary unchanged
        if: steps.release.outputs.auto_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "OPERATING_JOB_DEFINITION_MUTATION=NO"
          echo "STEP_FUNCTIONS_UPDATE_EXECUTED=NO"
          echo "CHAMPION_PROMOTION_EXECUTED=NO"
          echo "RESEARCH_CANDIDATE_ONLY_RELEASE=SUCCESS"

      - name: Publish workflow summary
        if: always()
        shell: bash
        env:
          PUSH_IMAGE: ${{ steps.release.outputs.push_image }}
          AUTO_CANDIDATE: ${{ steps.release.outputs.auto_candidate }}
          BUILD_ID: ${{ steps.start.outputs.build_id }}
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.candidate_revision }}
          CANDIDATE_JOB_NAME: ${{ steps.candidate.outputs.candidate_job_name }}
          CANDIDATE_EXIT_CODE: ${{ steps.candidate.outputs.candidate_exit_code }}
        run: |
          {
            echo "## Research DevOps"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Source SHA | \`${GITHUB_SHA:0:12}\` |"
            echo "| Event | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Push Image | \`${PUSH_IMAGE:-false}\` |"
            echo "| Auto Candidate | \`${AUTO_CANDIDATE:-false}\` |"
            echo "| CodeBuild Started | \`${BUILD_ID:+YES}\` |"
            echo "| Candidate Revision | \`${CANDIDATE_REVISION:-N/A}\` |"
            echo "| Candidate Job | \`${CANDIDATE_JOB_NAME:-N/A}\` |"
            echo "| Candidate Exit Code | \`${CANDIDATE_EXIT_CODE:-N/A}\` |"
            echo "| Champion Promotion | \`NO\` |"
            echo "| Step Functions Update | \`NO\` |"
          } >> "${GITHUB_STEP_SUMMARY}"